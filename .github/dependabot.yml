# Cập nhật dependency tự động. Mỗi PR của Dependabot vẫn phải qua CI như mọi PR khác.
# cooldown: chỉ đề xuất bản đã phát hành ít nhất 14 ngày, theo quy ước trong CLAUDE.md.
# Bản vá bảo mật (security update) không bị cooldown giữ lại.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Action được pin theo commit SHA (kèm comment phiên bản); Dependabot cập nhật cả SHA lẫn comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
