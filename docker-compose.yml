services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: userapi
      POSTGRES_PASSWORD: userapi
      POSTGRES_DB: userapi
    ports:
      - "127.0.0.1:5432:5432" # Local machine only; do not expose to the network.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userapi -d userapi"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Run migrations once and exit, like a Kubernetes Job / initContainer.
  migrate:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://userapi:userapi@db:5432/userapi?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    environment:
      HTTP_ADDR: ":8080"
      STORAGE: postgres
      DATABASE_URL: postgres://userapi:userapi@db:5432/userapi?sslmode=disable
      LOG_LEVEL: info
      DB_MAX_CONNS: "10"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
